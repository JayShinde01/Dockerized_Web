version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/
        VITE_ML_API_URL: http://localhost:8000/
    ports:
      - "80:80"
    depends_on:
      - backend
      - backend_ml
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env        # 👈 explicitly load your .env here
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: always

  backend_ml:
    build:
      context: ./backend_ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always
